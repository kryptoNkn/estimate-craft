# Крейт auth-service: бинарник логина/регистрации/сессий.
# Зависимости только этого сервиса. Workspace — в backend/Cargo.toml.

[package]
name = "auth-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace", "cors", "timeout"] }
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
validator = { version = "0.20", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
sha2 = "0.10"
tower_governor = { version = "0.8", features = ["axum"] }
governor = "0.10"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1-native-tls",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[dependencies.sqlx]
version = "0.8"
features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "derive",
    "migrate",
    "json"
]